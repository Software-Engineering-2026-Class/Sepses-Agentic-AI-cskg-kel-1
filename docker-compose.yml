services:
  sepses-app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: ${PWD}
    environment:
      PYTHONUNBUFFERED: "1"
      NVD_API_KEY: ${NVD_API_KEY:-}
    volumes:
      - .:/app
      - .:${PWD}
    command: ["sleep", "infinity"]
    tty: true

  sepses-qlever:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: ${PWD}
    restart: unless-stopped
    mem_limit: ${QLEVER_CONTAINER_MEMORY:-16g}
    environment:
      PYTHONUNBUFFERED: "1"
      QLEVER_BOOT_TIMEOUT_SECONDS: ${QLEVER_BOOT_TIMEOUT_SECONDS:-600}
      QLEVER_CHECK_INTERVAL_SECONDS: ${QLEVER_CHECK_INTERVAL_SECONDS:-10}
      QLEVER_RETRY_AFTER_FAILURE_SECONDS: ${QLEVER_RETRY_AFTER_FAILURE_SECONDS:-30}
      QLEVER_AUTOBUILD: "0"
      QLEVER_AUTO_START: ${QLEVER_AUTO_START:-1}
      QLEVER_CONTAINER_MEMORY: ${QLEVER_CONTAINER_MEMORY:-16g}
      QLEVER_STXXL_MEMORY: ${QLEVER_STXXL_MEMORY:-AUTO}
      QLEVER_PARSER_BUFFER_SIZE: ${QLEVER_PARSER_BUFFER_SIZE:-AUTO}
      QLEVER_NUM_THREADS: ${QLEVER_NUM_THREADS:-1}
      QLEVER_MEMORY_FOR_QUERIES: ${QLEVER_MEMORY_FOR_QUERIES:-768M}
      QLEVER_CACHE_MAX_SIZE: ${QLEVER_CACHE_MAX_SIZE:-256M}
      QLEVER_INDEX_OOM_RETRIES: ${QLEVER_INDEX_OOM_RETRIES:-3}
      QLEVER_MIN_INDEX_MEMORY_BYTES: ${QLEVER_MIN_INDEX_MEMORY_BYTES:-4294967296}
    ports:
      - "7001:7001"
    volumes:
      - .:/app
      - .:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/bin/bash", "/app/scripts/docker-entrypoint-qlever.sh"]
    depends_on:
      - sepses-app

  # Custom QLever Interface — antarmuka query Python buatan tim (port 8000)
  sepses-qlever-interface:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: ${PWD}
    environment:
      PYTHONUNBUFFERED: "1"
      QLEVER_ENDPOINT_URL: ${QLEVER_ENDPOINT_URL:-http://host.docker.internal:7001/sparql}
      QLEVER_INTERFACE_HOST: 0.0.0.0
      QLEVER_INTERFACE_PORT: 8000
    ports:
      - "${QLEVER_INTERFACE_PORT:-8000}:8000"
    volumes:
      - .:/app
      - .:${PWD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.sparql.qlever_interface", "--host", "0.0.0.0", "--port", "8000"]

  # QLever UI — antarmuka web resmi QLever untuk query SPARQL secara interaktif
  # Akses di: http://localhost:7000
  # Backend SPARQL endpoint: http://localhost:7001/sparql
  sepses-qlever-ui:
    image: adfreiburg/qlever-ui:latest
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      # URL backend SPARQL — gunakan nama service Docker agar bisa diakses dalam internal network
      QLEVER_API_ENDPOINT: "http://sepses-qlever:7001"
      QLEVER_UI_PORT: "7000"
    depends_on:
      - sepses-qlever
